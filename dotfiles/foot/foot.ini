# ~/.config/foot/foot.ini - Foot Terminal Configuration
# Monochrome Aesthetics & Low Latency Setup

term=foot
font=JetBrains Mono:size=11, Monocraft:size=10
dpi-aware=yes
pad=8x8
resize-delay-ms=0

[colors-dark]
background=000000
foreground=ffffff

## Normal colors (monochrome scale)
regular0=000000 # black
regular1=555555 # dark grey
regular2=888888 # grey
regular3=aaaaaa # light grey
regular4=cccccc # pale white
regular5=dddddd # bright grey
regular6=eeeeee # off white
regular7=ffffff # white

## Bright colors
bright0=222222
bright1=666666
bright2=999999
bright3=bbbbbb
bright4=dddddd
bright5=eeeeee
bright6=ffffff
bright7=ffffff

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes
